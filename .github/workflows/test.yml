name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install homeassistant pytest
      - name: Run tests
        run: python -m pytest tests -q
      - name: Compile integration
        run: python -m compileall -q custom_components
      - name: Validate JSON files
        run: |
          python -m json.tool custom_components/sanremo_cube/manifest.json >/dev/null
          python -m json.tool custom_components/sanremo_cube/strings.json >/dev/null
          python -m json.tool custom_components/sanremo_cube/translations/en.json >/dev/null
